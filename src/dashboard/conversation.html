<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Cortex</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #1a1612;
    --bg: #211d18;
    --bg-surface: #2a2520;
    --bg-surface-hover: #332e28;
    --bg-elevated: #3a342d;
    --border: #3d362e;
    --border-soft: #332c25;

    --text: #e8e0d4;
    --text-secondary: #b8ad9e;
    --text-dim: #8a7e70;
    --text-muted: #5e544a;

    --green: #6b9e5e;
    --green-bright: #8aba7c;
    --green-dim: #4a7040;
    --green-surface: #2a3528;
    --green-border: #3d5235;

    --brown-warm: #8b6f4e;
    --brown-light: #a88a68;
    --amber: #c4956a;
    --amber-dim: #8a6840;
    --gold: #d4a857;

    --sage: #7a9477;
    --sage-dim: #5a7458;
    --sage-surface: #283028;

    --red-soft: #c47060;
    --purple-soft: #9a82b4;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ──────────────────────────────── */

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-logo {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--green-dim), var(--green));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }

  .header h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .connection-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg-elevated);
    color: var(--text-muted);
    border: 1px solid var(--border);
    transition: all 0.3s;
  }

  .connection-badge.connected {
    background: var(--green-surface);
    color: var(--green-bright);
    border-color: var(--green-border);
  }

  .header nav {
    display: flex;
    gap: 4px;
  }

  .header nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .header nav a:hover {
    color: var(--text-secondary);
    background: var(--bg-surface);
  }
  .header nav a.active {
    color: var(--text);
    background: var(--bg-surface);
  }

  /* ── Main layout ─────────────────────────── */

  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* ── Left pane: System Activity ──────────── */

  .activity-pane {
    width: 42%;
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    min-width: 280px;
    background: var(--bg-deep);
  }

  .pane-header {
    padding: 12px 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pane-header .pane-icon {
    font-size: 13px;
    opacity: 0.6;
  }

  .activity-feed {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }

  .activity-item {
    padding: 7px 20px 7px 18px;
    font-size: 13px;
    line-height: 1.5;
    border-left: 2px solid transparent;
    transition: background 0.12s;
    color: var(--text-secondary);
  }

  .activity-item:hover {
    background: var(--bg-surface);
  }

  .activity-item.major {
    border-left-color: var(--green);
    color: var(--text);
    font-weight: 500;
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .activity-item.minor {
    color: var(--text-dim);
    font-size: 12px;
    border-left-color: transparent;
  }

  .activity-time {
    color: var(--text-muted);
    font-size: 10px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    margin-right: 10px;
    letter-spacing: 0.02em;
  }

  .activity-children {
    margin-top: 4px;
    padding-left: 16px;
    border-left: 1px solid var(--border-soft);
    margin-left: 4px;
  }

  .activity-child {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.7;
    padding: 1px 0;
  }

  .activity-child .label {
    color: var(--text-muted);
    font-weight: 500;
  }

  .activity-child.warn { color: var(--amber); }
  .activity-child.success { color: var(--green-bright); }

  /* ── Right pane: Conversation ────────────── */

  .conversation-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 320px;
    background: var(--bg);
  }

  .conversation-feed {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .message {
    max-width: 82%;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.cortex {
    align-self: flex-start;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 16px 16px 16px 4px;
    color: var(--text);
  }

  .message.parsifal {
    align-self: flex-end;
    background: var(--green-dim);
    border: 1px solid var(--green-border);
    border-radius: 16px 16px 4px 16px;
    color: var(--text);
  }

  .message.question {
    align-self: flex-start;
    background: var(--bg-surface);
    border: 1px solid var(--amber-dim);
    border-radius: 16px 16px 16px 4px;
    color: var(--text);
  }

  .message.question::before {
    content: '';
    display: block;
    width: 16px;
    height: 2px;
    background: var(--amber);
    border-radius: 1px;
    margin-bottom: 8px;
  }

  .message.proactive {
    align-self: flex-start;
    background: var(--sage-surface);
    border: 1px solid var(--sage-dim);
    border-radius: 16px 16px 16px 4px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .message-meta {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  .message.cortex .message-meta { text-align: left; }
  .message.parsifal .message-meta { text-align: right; }

  /* ── Input area ──────────────────────────── */

  .input-area {
    padding: 14px 24px 16px;
    border-top: 1px solid var(--border-soft);
    background: var(--bg);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-row textarea {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 11px 16px;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    line-height: 1.5;
  }

  .input-row textarea::placeholder {
    color: var(--text-muted);
  }

  .input-row textarea:focus {
    border-color: var(--green-dim);
    box-shadow: 0 0 0 2px rgba(107, 158, 94, 0.15);
  }

  .input-row button {
    background: var(--green-dim);
    color: var(--text);
    border: 1px solid var(--green-border);
    border-radius: 12px;
    padding: 11px 22px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    letter-spacing: 0.01em;
  }

  .input-row button:hover {
    background: var(--green);
    border-color: var(--green);
  }

  .input-row button:active {
    transform: scale(0.97);
  }

  .input-row button:disabled {
    opacity: 0.35;
    cursor: default;
    transform: none;
  }

  /* ── Status bar ──────────────────────────── */

  .status-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 7px 20px;
    border-top: 1px solid var(--border-soft);
    background: var(--bg-deep);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    letter-spacing: 0.01em;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-label { color: var(--text-dim); }
  .status-value { color: var(--brown-light); }

  /* ── Scrollbar ───────────────────────────── */

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ── Empty state ─────────────────────────── */

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
    padding: 40px;
    line-height: 1.7;
    gap: 12px;
  }

  .empty-state .empty-icon {
    font-size: 32px;
    opacity: 0.3;
    margin-bottom: 4px;
  }

  .empty-state p {
    max-width: 260px;
  }

  /* ── Divider for date/time groups ─────────── */

  .time-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px 4px;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .time-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-soft);
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">C</div>
    <h1>Agent Cortex</h1>
    <span class="connection-badge" id="connectionBadge">disconnected</span>
  </div>
  <nav>
    <a href="/trace">Trace</a>
    <a href="/build">Build</a>
    <a href="/conversation" class="active">Conversation</a>
  </nav>
</div>

<div class="main">
  <!-- Left pane: System Activity -->
  <div class="activity-pane">
    <div class="pane-header">
      <span class="pane-icon">&#9670;</span>
      System Activity
    </div>
    <div class="activity-feed" id="activityFeed">
      <div class="empty-state" id="activityEmpty">
        <div class="empty-icon">&#9673;</div>
        <p>Waiting for Cortex to start...</p>
      </div>
    </div>
  </div>

  <!-- Right pane: Conversation -->
  <div class="conversation-pane">
    <div class="pane-header">
      <span class="pane-icon">&#9676;</span>
      Conversation
    </div>
    <div class="conversation-feed" id="conversationFeed">
      <div class="empty-state" id="conversationEmpty">
        <div class="empty-icon">&#10047;</div>
        <p>Start a conversation with Cortex. It will hear you while it works.</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <textarea
          id="messageInput"
          placeholder="Type a message..."
          rows="1"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="status-bar" id="statusBar">
  <div class="status-item">
    <span class="status-label">state</span>
    <span class="status-value" id="statusState">idle</span>
  </div>
</div>

<script>
// ─── WebSocket connection ──────────────────────────────────

const wsUrl = `ws://${location.host}/conversation`;
let ws = null;
let reconnectTimer = null;

function connect() {
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    const badge = document.getElementById('connectionBadge');
    badge.classList.add('connected');
    badge.textContent = 'connected';
    if (reconnectTimer) { clearInterval(reconnectTimer); reconnectTimer = null; }
  };

  ws.onclose = () => {
    const badge = document.getElementById('connectionBadge');
    badge.classList.remove('connected');
    badge.textContent = 'disconnected';
    if (!reconnectTimer) {
      reconnectTimer = setInterval(() => connect(), 3000);
    }
  };

  ws.onerror = () => {};

  ws.onmessage = (event) => {
    try {
      const wire = JSON.parse(event.data);
      switch (wire.channel) {
        case 'message': handleMessage(wire.payload); break;
        case 'narration': handleNarration(wire.payload); break;
        case 'status': handleStatus(wire.payload); break;
      }
    } catch (e) {
      console.warn('Invalid message:', e);
    }
  };
}

connect();

// ─── Message handling (right pane) ─────────────────────────

function handleMessage(msg) {
  const feed = document.getElementById('conversationFeed');
  removeEmpty('conversationEmpty');

  const el = document.createElement('div');

  if (msg.role === 'parsifal') {
    el.className = 'message parsifal';
    el.innerHTML = `
      <div>${formatText(msg.text)}</div>
      <div class="message-meta">${formatTime(msg.timestamp)}</div>
    `;
  } else {
    const kind = msg.kind || 'acknowledgment';
    const className = kind === 'question' ? 'question'
      : kind === 'proactive' ? 'proactive'
      : 'cortex';
    el.className = `message ${className}`;
    el.innerHTML = `
      <div>${formatText(msg.text)}</div>
      <div class="message-meta">${formatTime(msg.timestamp)}</div>
    `;
  }

  feed.appendChild(el);
  scrollToBottom(feed);
}

// ─── Narration handling (left pane) ────────────────────────

function handleNarration(item) {
  const feed = document.getElementById('activityFeed');
  removeEmpty('activityEmpty');

  const el = document.createElement('div');
  const level = item.level || 'normal';
  el.className = `activity-item ${level}`;

  let html = `<span class="activity-time">${formatTime(item.timestamp)}</span>${escapeHtml(item.headline)}`;

  if (item.children && item.children.length > 0) {
    html += '<div class="activity-children">';
    for (const child of item.children) {
      const sev = child.severity ? ` ${child.severity}` : '';
      html += `<div class="activity-child${sev}"><span class="label">${escapeHtml(child.label)}</span> ${escapeHtml(child.value)}</div>`;
    }
    html += '</div>';
  }

  el.innerHTML = html;
  feed.appendChild(el);
  scrollToBottom(feed);
}

// ─── Status handling (bottom bar) ──────────────────────────

function handleStatus(status) {
  const bar = document.getElementById('statusBar');
  const items = [];

  if (status.projectState) items.push(si('state', status.projectState));
  if (status.task) items.push(si('task', truncate(status.task, 40)));
  if (status.phase) items.push(si('phase', status.phase));
  if (status.cycle != null) items.push(si('cycle', status.cycle));
  if (status.ne != null) items.push(si('ne', status.ne.toFixed(2)));
  if (status.budgetUsed != null) items.push(si('budget', (status.budgetUsed * 100).toFixed(0) + '%'));

  if (items.length === 0) items.push(si('state', 'idle'));

  bar.innerHTML = items.join('');
}

function si(label, value) {
  return `<div class="status-item"><span class="status-label">${label}</span> <span class="status-value">${escapeHtml(String(value))}</span></div>`;
}

// ─── Send message ──────────────────────────────────────────

function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  ws.send(JSON.stringify({ channel: 'input', payload: { text } }));
  input.value = '';
  input.style.height = 'auto';
  input.focus();
}

const input = document.getElementById('messageInput');
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// ─── Helpers ───────────────────────────────────────────────

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function formatText(str) {
  return escapeHtml(str).replace(/\n/g, '<br>');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function truncate(str, max) {
  if (str.length <= max) return str;
  return str.slice(0, max - 1) + '\u2026';
}

function removeEmpty(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function scrollToBottom(el) {
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}
</script>
</body>
</html>
