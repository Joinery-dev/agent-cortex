<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Cortex</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232733;
      --border: #2d3244;
      --text: #e2e4ea;
      --text-dim: #8b8fa3;
      --accent: #7c6af0;
      --accent-dim: #5b4cc4;
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
      --orange: #fb923c;
      --blue: #60a5fa;
      --cyan: #22d3ee;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    header h1 span { color: var(--accent); }

    .status-pill {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-waiting { background: var(--surface2); color: var(--text-dim); }
    .status-running { background: rgba(124,106,240,0.15); color: var(--accent); animation: pulse 2s infinite; }
    .status-complete { background: rgba(74,222,128,0.15); color: var(--green); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .container {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      gap: 0;
      height: calc(100vh - 65px);
    }

    /* ─── Left: Pipeline ─── */
    .pipeline {
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      overflow-y: auto;
    }

    .pipeline h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .stage {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      transition: all 0.3s;
    }

    .stage.active {
      background: rgba(124,106,240,0.1);
    }

    .stage.done {
      opacity: 0.6;
    }

    .stage-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
      background: var(--surface2);
      border: 2px solid var(--border);
      transition: all 0.3s;
    }

    .stage.active .stage-dot {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(124,106,240,0.4);
    }

    .stage.done .stage-dot {
      background: var(--green);
      border-color: var(--green);
    }

    .stage-name {
      font-size: 13px;
      font-weight: 500;
    }

    .stage-detail {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .stage-line {
      width: 2px;
      height: 16px;
      background: var(--border);
      margin-left: 24px;
    }

    /* ─── Center: Main content ─── */
    .main {
      padding: 24px 32px;
      overflow-y: auto;
    }

    .section {
      margin-bottom: 32px;
    }

    .section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    /* Sense activation grid (flat, used by evaluation) */
    .sense-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }

    .sense-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      transition: all 0.4s;
      opacity: 0;
      transform: translateY(8px);
    }

    .sense-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .sense-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .sense-card-name {
      font-size: 12px;
      font-weight: 600;
    }

    .sense-card-score {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .score-high { background: rgba(74,222,128,0.15); color: var(--green); }
    .score-mid { background: rgba(250,204,21,0.15); color: var(--yellow); }
    .score-low { background: rgba(248,113,113,0.15); color: var(--red); }

    .sense-card-path {
      font-size: 10px;
      color: var(--text-dim);
    }

    .sense-card-assessment {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      line-height: 1.5;
    }

    /* Score bar */
    .score-bar-track {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease-out;
    }

    /* ─── Council perspectives ─── */
    .council-perspectives {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .council-perspectives .sense-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      animation: fadeIn 0.3s ease-out;
    }

    .council-perspectives .sense-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .council-perspectives .sense-card-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .council-perspectives .sense-card-meta {
      font-size: 10px;
      color: var(--text-dim);
    }

    .council-perspectives .sense-card-perspective {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Work output */
    .work-output {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
    }

    /* Work tabs */
    .work-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 12px;
    }

    .work-tab {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    .work-tab:first-child { border-radius: 6px 0 0 6px; }
    .work-tab:last-child { border-radius: 0 6px 6px 0; }

    .work-tab.active {
      background: var(--accent-dim);
      color: var(--text);
      border-color: var(--accent);
    }

    .work-preview {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .work-preview iframe {
      width: 100%;
      height: 600px;
      border: none;
    }

    /* Tension cards */
    .tension-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 8px;
      animation: slideIn 0.3s ease-out;
    }

    .tension-card.severity-high { border-left-color: var(--red); }
    .tension-card.severity-medium { border-left-color: var(--orange); }
    .tension-card.severity-low { border-left-color: var(--yellow); }

    .tension-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .tension-severity {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .tension-desc {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .tension-resolution {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--green);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ─── Right: Event log ─── */
    .event-log {
      border-left: 1px solid var(--border);
      padding: 24px 20px;
      overflow-y: auto;
    }

    .event-log h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .event {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.2s ease-out;
    }

    .event-time {
      font-size: 10px;
      color: var(--text-dim);
    }

    .event-type {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 2px;
    }

    .event-detail {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ─── Activation cascade (lightning forest) ─── */
    .lightning-forest {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      padding: 16px 0;
    }

    .lightning-tree {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bolt-node {
      padding: 8px 14px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      opacity: 0.15;
      transform: scale(0.92);
      transition: opacity 0.4s ease-out, transform 0.35s ease-out,
                  border-color 0.4s, box-shadow 0.4s;
    }

    .bolt-node.struck {
      opacity: 1;
      transform: scale(1);
    }

    .bolt-persona.struck {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(124,106,240,0.35), 0 0 4px rgba(124,106,240,0.2);
    }

    .bolt-facet.struck {
      border-color: var(--blue);
      box-shadow: 0 0 14px rgba(96,165,250,0.25);
    }

    .bolt-instinct.struck {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(34,211,238,0.25);
    }

    .bolt-persona-name {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      text-align: center;
    }

    .bolt-persona-score {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
      text-align: center;
    }

    .bolt-facet-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }

    .bolt-instinct-name {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
    }

    .bolt-line {
      width: 2px;
      height: 20px;
      background: var(--border);
      opacity: 0;
      transition: opacity 0.25s ease-out, background 0.25s, box-shadow 0.25s;
    }

    .bolt-line.struck {
      opacity: 1;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(124,106,240,0.5);
    }

    .bolt-branch {
      display: flex;
      gap: 16px;
      position: relative;
      padding-top: 18px;
      justify-content: center;
    }

    .bolt-rail {
      position: absolute;
      top: 0;
      height: 2px;
      background: var(--border);
      opacity: 0;
      transition: opacity 0.3s ease-out, background 0.3s, box-shadow 0.3s;
    }

    .bolt-rail.struck {
      opacity: 1;
      background: var(--accent);
      box-shadow: 0 0 6px rgba(124,106,240,0.4);
    }

    .bolt-stem {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Vertical stub from rail down to each stem node */
    .bolt-stem::before {
      content: '';
      width: 2px;
      height: 18px;
      background: var(--border);
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.3s ease-out, background 0.3s;
    }

    .bolt-stem:has(.bolt-node.struck)::before {
      opacity: 1;
      background: var(--accent);
    }

    /* ─── Empty states ─── */
    .empty {
      color: var(--text-dim);
      font-size: 12px;
      font-style: italic;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1><span>Agent</span> Cortex</h1>
    <div id="status" class="status-pill status-waiting">Waiting</div>
    <div style="flex:1"></div>
    <div id="cycle-badge" style="font-size: 12px; color: var(--text-dim);"></div>
    <a href="/build" style="padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;text-decoration:none;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);">Build Progress</a>
  </header>

  <div class="container">
    <!-- Left: Pipeline stages -->
    <div class="pipeline">
      <h2>Pipeline</h2>
      <div id="stages"></div>
    </div>

    <!-- Center: Main content -->
    <div class="main">
      <div id="consultation-section" class="section" style="display:none">
        <h2>Activation Cascade</h2>
        <div id="lightning-forest" class="lightning-forest"></div>
      </div>

      <div id="evaluation-section" class="section" style="display:none">
        <h2>Tension Balance</h2>
        <div id="radar-wrap" style="position:relative; width:100%; display:flex; justify-content:center;">
          <canvas id="radar-canvas" width="560" height="560" style="max-width:100%;"></canvas>
        </div>
      </div>

      <div id="tension-section" class="section" style="display:none">
        <h2>Tensions</h2>
        <div id="tension-list"></div>
      </div>

      <div id="work-section" class="section" style="display:none">
        <h2>Work Product</h2>
        <div class="work-tabs">
          <div class="work-tab active" onclick="showWorkTab('preview')">Preview</div>
          <div class="work-tab" onclick="showWorkTab('code')">Code</div>
        </div>
        <div id="work-preview" class="work-preview">
          <iframe id="work-iframe" sandbox="allow-same-origin"></iframe>
        </div>
        <div id="work-code" class="work-output" style="display:none"></div>
      </div>

      <div id="empty-main" class="empty">Waiting for cortex to start...</div>
    </div>

    <!-- Right: Event log -->
    <div class="event-log">
      <h2>Event Stream</h2>
      <div id="events"></div>
    </div>
  </div>

  <script>
    const stages = [
      { id: 'consultation', name: 'Consultation', detail: 'Senses weigh in on the task' },
      { id: 'producing', name: 'Motor Cortex', detail: 'Creating work from perspectives' },
      { id: 'evaluation', name: 'Evaluation', detail: 'Senses score through their lens' },
      { id: 'tension', name: 'Tension Detection', detail: 'Finding conflicts between perspectives' },
      { id: 'resolution', name: 'Resolution', detail: 'Creative synthesis of competing forces' },
    ];

    let currentStage = null;
    const completedStages = new Set();
    let consultationData = [];  // accumulated from consultation:perspective events

    // Render pipeline stages
    function renderStages() {
      const el = document.getElementById('stages');
      el.innerHTML = stages.map((s, i) => `
        <div class="stage ${s.id === currentStage ? 'active' : ''} ${completedStages.has(s.id) ? 'done' : ''}" id="stage-${s.id}">
          <div class="stage-dot"></div>
          <div>
            <div class="stage-name">${s.name}</div>
            <div class="stage-detail">${s.detail}</div>
          </div>
        </div>
        ${i < stages.length - 1 ? '<div class="stage-line"></div>' : ''}
      `).join('');
    }

    function setStage(id) {
      if (currentStage) completedStages.add(currentStage);
      currentStage = id;
      renderStages();
    }

    function setStatus(text, cls) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status-pill ' + cls;
    }

    function addEvent(type, detail) {
      const el = document.getElementById('events');
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = 'event';
      div.innerHTML = `
        <div class="event-time">${time}</div>
        <div class="event-type">${type}</div>
        ${detail ? `<div class="event-detail">${detail}</div>` : ''}
      `;
      el.prepend(div);
    }

    function scoreClass(score) {
      if (score >= 7) return 'score-high';
      if (score >= 5) return 'score-mid';
      return 'score-low';
    }

    function scoreColor(score) {
      if (score >= 7) return 'var(--green)';
      if (score >= 5) return 'var(--yellow)';
      return 'var(--red)';
    }

    // Size horizontal rails to span from first to last sibling stem center
    function sizeRails() {
      document.querySelectorAll('.bolt-rail').forEach(rail => {
        const branch = rail.parentElement;
        const stems = Array.from(branch.querySelectorAll(':scope > .bolt-stem'));
        if (stems.length < 2) { rail.style.display = 'none'; return; }

        const branchRect = branch.getBoundingClientRect();
        const firstRect = stems[0].getBoundingClientRect();
        const lastRect = stems[stems.length - 1].getBoundingClientRect();

        const left = (firstRect.left + firstRect.width / 2) - branchRect.left;
        const right = (lastRect.left + lastRect.width / 2) - branchRect.left;

        rail.style.left = left + 'px';
        rail.style.width = (right - left) + 'px';
      });
    }

    window.addEventListener('resize', sizeRails);

    // ─── Radar chart: tension balance visualization ─────────

    // State accumulation — scores arrive before tensions
    const radarState = {
      scores: [],     // { path: "A > B > C", score: 7 }
      tensions: [],   // { severity, senseA: { path, score }, senseB: { path, score } }
      rendered: false,
    };

    // Placement algorithm: arrange senses on a circle so tension
    // pairs sit opposite each other.
    //
    //  1. Sort tensions by severity (high → low)
    //  2. Create N slots evenly around the circle
    //  3. Place highest-severity tension pair at 0° and 180°
    //  4. Subsequent tensions: if one node placed, put the other
    //     in the empty slot nearest to 180° away
    //  5. Unplaced senses cluster near persona siblings
    //  6. Remaining → fill largest gaps
    function computeAxisOrder(scores, tensions) {
      const N = scores.length;
      if (N === 0) return [];

      const slotAngle = (2 * Math.PI) / N;
      const placed = new Map();  // path → slotIndex
      const taken = new Set();   // slotIndex set

      // Sort tensions: high > medium > low
      const sevOrder = { high: 0, medium: 1, low: 2 };
      const sorted = [...tensions].sort((a, b) => sevOrder[a.severity] - sevOrder[b.severity]);

      function nearestEmpty(targetSlot) {
        // Search outward from targetSlot for an empty slot
        for (let offset = 0; offset < N; offset++) {
          const cw = ((targetSlot + offset) % N + N) % N;
          if (!taken.has(cw)) return cw;
          const ccw = ((targetSlot - offset) % N + N) % N;
          if (!taken.has(ccw)) return ccw;
        }
        return 0; // fallback — shouldn't happen
      }

      function placeAt(path, slot) {
        placed.set(path, slot);
        taken.add(slot);
      }

      function oppositeSlot(slot) {
        return (slot + Math.floor(N / 2)) % N;
      }

      // Step 1: Place tension pairs
      for (const t of sorted) {
        const pathA = t.senseA.path;
        const pathB = t.senseB.path;
        const aPlaced = placed.has(pathA);
        const bPlaced = placed.has(pathB);

        if (!aPlaced && !bPlaced) {
          // First pair gets slot 0; subsequent pairs get nearest empty to 0
          const slotA = nearestEmpty(0);
          placeAt(pathA, slotA);
          const slotB = nearestEmpty(oppositeSlot(slotA));
          placeAt(pathB, slotB);
        } else if (aPlaced && !bPlaced) {
          const slotB = nearestEmpty(oppositeSlot(placed.get(pathA)));
          placeAt(pathB, slotB);
        } else if (!aPlaced && bPlaced) {
          const slotA = nearestEmpty(oppositeSlot(placed.get(pathB)));
          placeAt(pathA, slotA);
        }
        // both placed → skip
      }

      // Step 2: Place remaining by persona clustering
      const unplaced = scores.filter(s => !placed.has(s.path));
      for (const s of unplaced) {
        const persona = s.path.split(' > ')[0];
        // Find placed sibling with same persona
        let siblingSlot = null;
        for (const [path, slot] of placed) {
          if (path.startsWith(persona + ' > ')) {
            siblingSlot = slot;
            break;
          }
        }
        if (siblingSlot !== null) {
          placeAt(s.path, nearestEmpty(siblingSlot));
        }
      }

      // Step 3: Fill remaining into largest gaps
      const stillUnplaced = scores.filter(s => !placed.has(s.path));
      for (const s of stillUnplaced) {
        // Find largest gap between taken slots
        const slots = Array.from(taken).sort((a, b) => a - b);
        let bestGap = 0, bestMid = 0;
        for (let i = 0; i < slots.length; i++) {
          const next = i + 1 < slots.length ? slots[i + 1] : slots[0] + N;
          const gap = next - slots[i];
          if (gap > bestGap) {
            bestGap = gap;
            bestMid = Math.floor((slots[i] + next) / 2) % N;
          }
        }
        placeAt(s.path, nearestEmpty(bestMid));
      }

      // Build ordered result: slot 0 → N-1
      const ordered = new Array(N);
      for (const [path, slot] of placed) {
        const scoreObj = scores.find(s => s.path === path);
        ordered[slot] = scoreObj;
      }
      // Fill any gaps (safety)
      return ordered.filter(Boolean);
    }

    // Render the radar chart
    function renderRadar(scores, tensions) {
      const canvas = document.getElementById('radar-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const cx = W / 2;
      const cy = H / 2;
      const maxR = Math.min(cx, cy) - 60;  // leave room for labels

      const N = scores.length;
      if (N === 0) return;

      const ordered = computeAxisOrder(scores, tensions);
      const sliceAngle = (2 * Math.PI) / N;
      // Start at -90° (12 o'clock)
      const startAngle = -Math.PI / 2;

      ctx.clearRect(0, 0, W, H);

      // ─── Concentric rings ───
      const rings = [2, 4, 6, 8, 10];
      for (const ring of rings) {
        const r = (ring / 10) * maxR;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
        ctx.strokeStyle = ring === 10 ? 'rgba(45,50,68,0.8)' : 'rgba(45,50,68,0.4)';
        ctx.lineWidth = ring === 10 ? 1.5 : 1;
        ctx.stroke();
        // Ring label
        if (ring % 4 === 0 || ring === 10) {
          ctx.fillStyle = 'rgba(139,143,163,0.5)';
          ctx.font = '9px monospace';
          ctx.fillText(String(ring), cx + 4, cy - r + 11);
        }
      }

      // ─── Axis lines + labels ───
      const axisPoints = [];  // { x, y, angle } at score radius
      for (let i = 0; i < N; i++) {
        const angle = startAngle + i * sliceAngle;
        const endX = cx + Math.cos(angle) * maxR;
        const endY = cy + Math.sin(angle) * maxR;

        // Axis line
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = 'rgba(45,50,68,0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Score point
        const score = ordered[i].score;
        const r = (score / 10) * maxR;
        axisPoints.push({
          x: cx + Math.cos(angle) * r,
          y: cy + Math.sin(angle) * r,
          angle,
          score,
        });

        // Label
        const labelR = maxR + 18;
        const lx = cx + Math.cos(angle) * labelR;
        const ly = cy + Math.sin(angle) * labelR;
        const name = ordered[i].path.split(' > ').pop();

        ctx.save();
        ctx.fillStyle = '#e2e4ea';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Rotate labels on the sides so they don't overlap
        if (Math.abs(angle - startAngle) < 0.01 || Math.abs(angle - startAngle - Math.PI) < 0.01) {
          // Top or bottom — horizontal
          ctx.fillText(name, lx, ly);
        } else {
          ctx.translate(lx, ly);
          // Flip labels on left side so text reads left-to-right
          let rot = angle;
          if (angle > Math.PI / 2 || angle < -Math.PI / 2) {
            rot += Math.PI;
          }
          ctx.rotate(rot);
          ctx.fillText(name, 0, 0);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
        }
        ctx.restore();

        // Score value near the point
        ctx.fillStyle = score >= 7 ? '#4ade80' : score >= 5 ? '#facc15' : '#f87171';
        ctx.font = 'bold 10px monospace';
        const sLabelR = r + 10;
        const sx = cx + Math.cos(angle) * sLabelR;
        const sy = cy + Math.sin(angle) * sLabelR;
        ctx.textAlign = 'center';
        ctx.fillText(String(score), sx, sy);
      }

      // ─── Filled polygon ───
      if (axisPoints.length > 0) {
        // Glow
        ctx.beginPath();
        ctx.moveTo(axisPoints[0].x, axisPoints[0].y);
        for (let i = 1; i < axisPoints.length; i++) {
          ctx.lineTo(axisPoints[i].x, axisPoints[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(124,106,240,0.12)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(124,106,240,0.7)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Vertex dots
        for (const pt of axisPoints) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 4, 0, 2 * Math.PI);
          ctx.fillStyle = pt.score >= 7 ? '#4ade80' : pt.score >= 5 ? '#facc15' : '#f87171';
          ctx.fill();
          ctx.strokeStyle = '#0f1117';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }

      // ─── Tension arcs ───
      // Draw red dashed arcs between axes that are in tension
      for (const t of tensions) {
        const idxA = ordered.findIndex(s => s.path === t.senseA.path);
        const idxB = ordered.findIndex(s => s.path === t.senseB.path);
        if (idxA === -1 || idxB === -1) continue;

        const angleA = startAngle + idxA * sliceAngle;
        const angleB = startAngle + idxB * sliceAngle;

        // Draw a dashed arc at the outer ring connecting the two axes
        const arcR = maxR + 6;
        // Determine arc direction — always take the shorter arc
        let from = angleA;
        let to = angleB;
        let diff = to - from;
        if (diff < -Math.PI) diff += 2 * Math.PI;
        if (diff > Math.PI) diff -= 2 * Math.PI;

        ctx.beginPath();
        if (diff >= 0) {
          ctx.arc(cx, cy, arcR, from, from + diff);
        } else {
          ctx.arc(cx, cy, arcR, from, from + diff, true);
        }
        ctx.strokeStyle = t.severity === 'high' ? 'rgba(248,113,113,0.7)' :
                          t.severity === 'medium' ? 'rgba(251,146,60,0.6)' :
                          'rgba(250,204,21,0.4)';
        ctx.lineWidth = t.severity === 'high' ? 2.5 : 1.5;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Tension severity label at arc midpoint
        const midAngle = from + diff / 2;
        const labelArcR = arcR + 12;
        const mx = cx + Math.cos(midAngle) * labelArcR;
        const my = cy + Math.sin(midAngle) * labelArcR;
        ctx.fillStyle = t.severity === 'high' ? '#f87171' : t.severity === 'medium' ? '#fb923c' : '#facc15';
        ctx.font = 'bold 8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(t.severity.toUpperCase(), mx, my);
      }
    }

    // SSE connection
    const source = new EventSource('/events');

    source.onmessage = (e) => {
      const event = JSON.parse(e.data);
      handleEvent(event);
    };

    function handleEvent(event) {
      const { type, data } = event;

      switch (type) {
        case 'task:start':
          document.getElementById('empty-main').style.display = 'none';
          setStatus('Running', 'status-running');
          addEvent('Task Started', data.description);
          break;

        case 'consultation:start':
          setStage('consultation');
          consultationData = [];
          addEvent('Consultation', `${data.senseCount} senses weighing in`);
          break;

        case 'consultation:perspective':
          consultationData.push({
            sense: data.sense,
            evaluatorCount: data.evaluatorCount,
            evaluators: data.evaluators || [],
          });
          addEvent('Perspective', `${data.sense}: ${data.evaluatorCount} evaluators`);
          break;

        case 'consultation:complete': {
          completedStages.add('consultation');
          document.getElementById('consultation-section').style.display = 'block';
          const forest = document.getElementById('lightning-forest');
          forest.innerHTML = '';

          // Build tree from evaluator IDs (dot-notation: "design.visual-identity.color-harmony")
          const tree = {};
          for (const s of consultationData) {
            const personaName = s.sense;
            if (!tree[personaName]) tree[personaName] = { facets: {}, evaluatorCount: 0 };
            tree[personaName].evaluatorCount = s.evaluatorCount;

            for (const evalId of s.evaluators) {
              const parts = evalId.split('.');
              const facetId = parts.length >= 2 ? parts[1] : null;
              const instinctId = parts.length >= 3 ? parts[2] : null;

              if (facetId) {
                const facetName = facetId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                if (!tree[personaName].facets[facetName]) tree[personaName].facets[facetName] = { instincts: [] };

                if (instinctId) {
                  const instinctName = instinctId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                  tree[personaName].facets[facetName].instincts.push({ name: instinctName });
                }
              }
            }
          }

          const T_PERSONA = 0, T_FACET = 400, T_INSTINCT = 800, STAGGER = 120;
          let personaIdx = 0;

          for (const [personaName, pData] of Object.entries(tree)) {
            const treeEl = document.createElement('div');
            treeEl.className = 'lightning-tree';

            const personaNode = document.createElement('div');
            personaNode.className = 'bolt-node bolt-persona';
            personaNode.innerHTML = `
              <div class="bolt-persona-name">${personaName}</div>
              <div class="bolt-persona-score">${pData.evaluatorCount} evaluator${pData.evaluatorCount !== 1 ? 's' : ''}</div>
            `;
            treeEl.appendChild(personaNode);

            const facetEntries = Object.entries(pData.facets);
            if (facetEntries.length > 0) {
              const lineToFacets = document.createElement('div');
              lineToFacets.className = 'bolt-line';
              treeEl.appendChild(lineToFacets);

              const facetBranch = document.createElement('div');
              facetBranch.className = 'bolt-branch';
              if (facetEntries.length > 1) {
                const rail = document.createElement('div');
                rail.className = 'bolt-rail';
                facetBranch.appendChild(rail);
              }

              for (const [facetName, fData] of facetEntries) {
                const stem = document.createElement('div');
                stem.className = 'bolt-stem';

                const facetNode = document.createElement('div');
                facetNode.className = 'bolt-node bolt-facet';
                facetNode.innerHTML = `<div class="bolt-facet-name">${facetName}</div>`;
                stem.appendChild(facetNode);

                if (fData.instincts.length > 0) {
                  const lineToInstincts = document.createElement('div');
                  lineToInstincts.className = 'bolt-line';
                  stem.appendChild(lineToInstincts);

                  const instinctBranch = document.createElement('div');
                  instinctBranch.className = 'bolt-branch';
                  if (fData.instincts.length > 1) {
                    const iRail = document.createElement('div');
                    iRail.className = 'bolt-rail';
                    instinctBranch.appendChild(iRail);
                  }

                  fData.instincts.forEach(inst => {
                    const iStem = document.createElement('div');
                    iStem.className = 'bolt-stem';
                    const iNode = document.createElement('div');
                    iNode.className = 'bolt-node bolt-instinct';
                    iNode.innerHTML = `<div class="bolt-instinct-name">${inst.name}</div>`;
                    iStem.appendChild(iNode);
                    instinctBranch.appendChild(iStem);
                  });

                  stem.appendChild(instinctBranch);
                }

                facetBranch.appendChild(stem);
              }
              treeEl.appendChild(facetBranch);
            }

            forest.appendChild(treeEl);

            // ─── Animate: lightning strike cascade ───
            const pDelay = T_PERSONA + personaIdx * STAGGER;
            setTimeout(() => personaNode.classList.add('struck'), pDelay);

            treeEl.querySelectorAll('.bolt-facet').forEach((fn, fi) => {
              setTimeout(() => fn.classList.add('struck'), T_FACET + personaIdx * STAGGER + fi * 80);
            });
            treeEl.querySelectorAll('.bolt-instinct').forEach((iNode, ii) => {
              setTimeout(() => iNode.classList.add('struck'), T_INSTINCT + personaIdx * STAGGER + ii * 60);
            });
            treeEl.querySelectorAll('.bolt-line').forEach((ln, li) => {
              setTimeout(() => ln.classList.add('struck'), Math.max(T_FACET + personaIdx * STAGGER + li * 80 - 60, pDelay + 100));
            });
            treeEl.querySelectorAll('.bolt-rail').forEach((rl, ri) => {
              setTimeout(() => rl.classList.add('struck'), (ri === 0 ? T_FACET : T_INSTINCT) + personaIdx * STAGGER);
            });

            personaIdx++;
          }

          requestAnimationFrame(() => requestAnimationFrame(sizeRails));
          addEvent('Council Complete', `${data.perspectives} perspectives, ${data.totalEvaluators} evaluators`);
          renderStages();
          break;
        }

        case 'cycle:start':
          document.getElementById('cycle-badge').textContent = `Cycle ${data.cycle} / ${data.maxCycles}`;
          addEvent('Cycle', `Starting cycle ${data.cycle}`);
          break;

        case 'motor:start':
          setStage('producing');
          addEvent('Motor Cortex', data.isRevision ? 'Revising work...' : 'Producing...');
          break;

        case 'motor:complete':
          completedStages.add('producing');
          document.getElementById('work-section').style.display = 'block';
          document.getElementById('work-code').textContent = data.work;

          // Render HTML preview — extract HTML if wrapped in code fences
          let html = data.work;
          const htmlMatch = html.match(/```(?:html)?\s*([\s\S]*?)```/);
          if (htmlMatch) html = htmlMatch[1];
          const iframe = document.getElementById('work-iframe');
          iframe.srcdoc = html;

          addEvent('Build Complete', `${data.outputLength} chars`);
          renderStages();
          break;

        case 'evaluation:start':
          setStage('evaluation');
          radarState.scores = [];
          radarState.tensions = [];
          radarState.rendered = false;
          document.getElementById('evaluation-section').style.display = 'block';
          addEvent('Evaluation', `${data.senseCount} senses evaluating`);
          break;

        case 'evaluation:score':
          radarState.scores.push({ path: data.path, score: data.score });
          addEvent('Score', `${data.path.split(' > ').pop()}: ${data.score}/10`);
          break;

        case 'evaluation:complete':
          completedStages.add('evaluation');
          // Render radar now if tensions haven't arrived yet
          if (!radarState.rendered && radarState.scores.length > 0) {
            radarState.rendered = true;
            renderRadar(radarState.scores, radarState.tensions);
          }
          addEvent('Evaluations Complete', data.scores.map(s => `${s.path.split(' > ').pop()}: ${s.score}/10`).join(', '));
          renderStages();
          break;

        case 'tension:detection-complete':
          radarState.tensions = data.tensions || [];
          // Always re-render when tensions arrive — they add arcs to the chart
          if (radarState.scores.length > 0) {
            radarState.rendered = true;
            renderRadar(radarState.scores, radarState.tensions);
          }
          break;

        case 'tension:detected':
          setStage('tension');
          document.getElementById('tension-section').style.display = 'block';
          const list = document.getElementById('tension-list');
          const card = document.createElement('div');
          card.className = `tension-card severity-${data.severity}`;
          card.innerHTML = `
            <div class="tension-header">
              <div style="font-size:12px; font-weight:600;">${data.senseA.path} vs ${data.senseB.path}</div>
              <div class="tension-severity" style="background: ${data.severity === 'high' ? 'rgba(248,113,113,0.15); color:var(--red)' : 'rgba(251,146,60,0.15); color:var(--orange)'};">${data.severity}</div>
            </div>
            <div class="tension-desc">${data.description}</div>
            <div class="tension-scores" style="font-size:11px; color:var(--text-dim); margin-top:6px;">
              ${data.senseA.path.split(' > ').pop()}: ${data.senseA.score}/10 &nbsp;&bull;&nbsp; ${data.senseB.path.split(' > ').pop()}: ${data.senseB.score}/10
            </div>
          `;
          card.id = `tension-${list.children.length}`;
          list.appendChild(card);
          addEvent('Tension', `[${data.severity.toUpperCase()}] ${data.senseA.path.split(' > ').pop()} vs ${data.senseB.path.split(' > ').pop()}`);
          break;

        case 'resolution:start':
          setStage('resolution');
          addEvent('Resolution', `Resolving ${data.count} tension(s)`);
          break;

        case 'resolution:complete': {
          completedStages.add('resolution');
          // Find the most recent tension card and add resolution
          const tensions = document.getElementById('tension-list');
          if (tensions.lastElementChild) {
            const resDiv = document.createElement('div');
            resDiv.className = 'tension-resolution';
            resDiv.textContent = `Resolved: ${data.strategy}`;
            tensions.lastElementChild.appendChild(resDiv);
          }
          addEvent('Resolved', data.strategy);
          renderStages();
          break;
        }

        case 'task:complete':
          setStatus(data.status === 'complete' ? 'Complete' : 'Needs Human', data.status === 'complete' ? 'status-complete' : 'status-waiting');
          document.getElementById('cycle-badge').textContent = `${data.cycles} cycle(s) | ${(data.confidence * 100).toFixed(0)}% confidence`;
          addEvent('Done', `${data.status} after ${data.cycles} cycle(s), ${(data.confidence * 100).toFixed(0)}% confidence`);
          break;
      }
    }

    function showWorkTab(tab) {
      document.querySelectorAll('.work-tab').forEach(t => t.classList.remove('active'));
      if (tab === 'preview') {
        document.getElementById('work-preview').style.display = 'block';
        document.getElementById('work-code').style.display = 'none';
        document.querySelectorAll('.work-tab')[0].classList.add('active');
      } else {
        document.getElementById('work-preview').style.display = 'none';
        document.getElementById('work-code').style.display = 'block';
        document.querySelectorAll('.work-tab')[1].classList.add('active');
      }
    }

    // Initial render
    renderStages();
  </script>
</body>
</html>
