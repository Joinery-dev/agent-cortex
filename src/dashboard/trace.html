<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Cortex — Trace</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232733;
      --border: #2d3244;
      --text: #e2e4ea;
      --text-dim: #8b8fa3;
      --accent: #7c6af0;
      --accent-dim: #5b4cc4;
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
      --orange: #fb923c;
      --blue: #60a5fa;
      --cyan: #22d3ee;
      --pink: #f472b6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ─── */
    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    header h1 span { color: var(--accent); }

    .nav-tabs {
      display: flex;
      gap: 4px;
    }

    .nav-tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      font-family: inherit;
    }

    .nav-tab:hover { background: var(--surface2); color: var(--text); }
    .nav-tab.active { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }

    /* ─── Stats bar ─── */
    .stats-bar {
      display: flex;
      gap: 24px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    .stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
    }

    /* ─── Tab content area ─── */
    .tab-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .tab-pane {
      display: none;
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .tab-pane.active {
      display: flex;
    }

    /* ─── Stepper bar ─── */
    .stepper-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .stepper-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stepper-btn {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .stepper-btn:hover { background: var(--border); color: var(--text); }
    .stepper-btn.active-mode { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }

    .stepper-select {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
    }

    .stepper-select option { background: var(--surface); }

    .speed-slider {
      width: 100px;
      accent-color: var(--accent);
    }

    .speed-label {
      font-size: 10px;
      color: var(--text-dim);
      min-width: 50px;
      text-align: center;
    }

    .position-display {
      font-size: 11px;
      color: var(--text-dim);
      min-width: 60px;
      text-align: center;
    }

    .stepper-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    .kbd-hint {
      font-size: 9px;
      color: var(--text-dim);
      opacity: 0.5;
      margin-left: auto;
    }

    .exec-status {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .exec-status.mode-live { color: var(--green, #4ade80); }
    .exec-status.mode-paused { color: var(--yellow, #ffd93d); background: rgba(255,217,61,0.1); }
    .exec-status.mode-stepping { color: var(--accent); background: rgba(108,140,255,0.1); }
    .exec-status.mode-replaying { color: var(--orange, #ff8c42); background: rgba(255,140,66,0.1); }

    /* ─── Region dot ─── */
    .region-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    /* ═══════════════════════════════════════════════════════════
       Narrative tab: 3-panel layout
       ═══════════════════════════════════════════════════════════ */
    #tab-narrative { display: none; }
    #tab-narrative.active { display: flex; }

    .narrative-left {
      width: 280px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .narrative-left-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      font-weight: 600;
      flex-shrink: 0;
    }

    .narrative-list {
      flex: 1;
      overflow-y: auto;
    }

    .narrative-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .narrative-item:hover { background: var(--surface); }
    .narrative-item.selected { background: var(--surface2); border-left: 2px solid var(--accent); }

    .narrative-item-content {
      flex: 1;
      min-width: 0;
    }

    .narrative-item-headline {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .narrative-item-meta {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
      display: flex;
      gap: 8px;
    }

    /* ─── Narrative center ─── */
    .narrative-center {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }

    .narrative-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 13px;
    }

    .narrative-headline {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .narrative-summary {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-dim);
      margin-bottom: 24px;
      max-width: 700px;
    }

    .narrative-section {
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .narrative-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .narrative-section-header:hover { background: var(--surface2); }

    .narrative-section-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .narrative-section-chevron {
      font-size: 10px;
      color: var(--text-dim);
      transition: transform 0.2s;
    }

    .narrative-section.open .narrative-section-chevron {
      transform: rotate(90deg);
    }

    .narrative-section-label {
      font-size: 12px;
      font-weight: 600;
    }

    .narrative-section-size {
      font-size: 10px;
      color: var(--text-dim);
    }

    .narrative-section-body {
      display: none;
      padding: 0;
    }

    .narrative-section.open .narrative-section-body {
      display: block;
    }

    .narrative-section-content {
      font-size: 12px;
      line-height: 1.6;
      padding: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-x: auto;
      max-height: 500px;
      overflow-y: auto;
    }

    .content-prompt { color: #c77dff; }
    .content-response { color: var(--green); }
    .content-json { color: var(--yellow); }
    .content-code { color: var(--orange); }
    .content-prose { color: var(--text); }

    .iframe-container { position: relative; }

    .iframe-toggle {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      font-family: inherit;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
    }

    .iframe-toggle:hover { color: var(--text); }

    .narrative-iframe {
      width: 100%;
      height: 400px;
      border: none;
      background: #fff;
    }

    /* ─── Narrative right (context panel) ─── */
    .narrative-right {
      width: 280px;
      border-left: 1px solid var(--border);
      flex-shrink: 0;
      overflow-y: auto;
      padding: 16px;
    }

    .context-section { margin-bottom: 16px; }

    .context-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .context-value {
      font-size: 12px;
      color: var(--text);
      word-break: break-all;
    }

    .context-value.dim { color: var(--text-dim); }

    .context-nav {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .context-nav-btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .context-nav-btn:hover { background: var(--border); color: var(--text); }
    .context-nav-btn:disabled { opacity: 0.3; cursor: default; }

    /* ═══════════════════════════════════════════════════════════
       Timeline tab
       ═══════════════════════════════════════════════════════════ */
    #tab-timeline { display: none; }
    #tab-timeline.active { display: flex; }

    .timeline-left {
      width: 420px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .timeline-filters {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .timeline-search {
      flex: 1;
      min-width: 120px;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .timeline-search::placeholder { color: var(--text-dim); }

    .timeline-filter-select {
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .timeline-filter-select option { background: var(--surface); }

    .timeline-list {
      flex: 1;
      overflow-y: auto;
    }

    .timeline-event {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      font-size: 11px;
    }

    .timeline-event:hover { background: var(--surface); }
    .timeline-event.selected { background: var(--surface2); border-left: 2px solid var(--accent); }

    .timeline-seq {
      color: var(--text-dim);
      font-size: 10px;
      min-width: 30px;
      text-align: right;
      flex-shrink: 0;
    }

    .timeline-event-content {
      flex: 1;
      min-width: 0;
    }

    .timeline-event-type {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timeline-event-rhythm {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 1px;
    }

    .timeline-event-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      flex-shrink: 0;
      gap: 2px;
    }

    .severity-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .severity-trace { background: rgba(85,85,85,0.3); color: #888; }
    .severity-info { background: rgba(108,140,255,0.15); color: #6c8cff; }
    .severity-warn { background: rgba(255,217,61,0.15); color: #ffd93d; }
    .severity-error { background: rgba(255,107,107,0.15); color: #ff6b6b; }
    .severity-critical { background: rgba(255,71,87,0.2); color: #ff4757; }

    .timeline-delta {
      font-size: 9px;
      color: var(--text-dim);
    }

    /* Timeline inspector (right pane) */
    .timeline-inspector {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .inspector-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 13px;
    }

    .inspector-header {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .inspector-section { margin-bottom: 16px; }

    .inspector-section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .inspector-json {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
      color: var(--yellow);
    }

    /* ═══════════════════════════════════════════════════════════
       Flow tab
       ═══════════════════════════════════════════════════════════ */
    #tab-flow { display: none; }
    #tab-flow.active { display: flex; align-items: center; justify-content: center; }

    .flow-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flow-container svg { max-width: 95%; max-height: 95%; }

    .flow-empty {
      color: var(--text-dim);
      font-size: 13px;
    }

    /* ═══════════════════════════════════════════════════════════
       Brain Map tab
       ═══════════════════════════════════════════════════════════ */
    #tab-brain { display: none; }
    #tab-brain.active { display: flex; }

    .brain-map-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .brain-region {
      position: absolute;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 100px;
      text-align: center;
    }

    .brain-region:hover {
      border-color: var(--accent);
      z-index: 2;
    }

    .brain-region.active {
      animation: regionPulse 2s infinite;
    }

    @keyframes regionPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(124,106,240,0); }
      50% { box-shadow: 0 0 12px 4px rgba(124,106,240,0.3); }
    }

    .brain-region-name {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .brain-region-count {
      font-size: 10px;
      color: var(--text-dim);
    }

    .brain-region-last {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .brain-sidebar {
      width: 320px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brain-sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .brain-sidebar-events {
      flex: 1;
      overflow-y: auto;
    }

    .brain-sidebar-event {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .brain-sidebar-event-type { font-weight: 600; }

    .brain-sidebar-event-time {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ═══════════════════════════════════════════════════════════
       Waterfall tab
       ═══════════════════════════════════════════════════════════ */
    #tab-waterfall { display: none; }
    #tab-waterfall.active { display: flex; flex-direction: column; }

    .waterfall-container {
      flex: 1;
      overflow: auto;
      padding: 20px 24px;
    }

    .waterfall-span { margin-bottom: 4px; }

    .waterfall-span-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      background: var(--surface);
      font-size: 12px;
    }

    .waterfall-span-bar {
      height: 6px;
      border-radius: 3px;
      min-width: 4px;
      transition: width 0.3s;
    }

    .waterfall-span-name {
      font-weight: 600;
      white-space: nowrap;
    }

    .waterfall-span-duration {
      font-size: 10px;
      color: var(--text-dim);
      margin-left: auto;
    }

    .waterfall-span-cycles {
      font-size: 10px;
      color: var(--accent);
    }

    .waterfall-children {
      margin-left: 24px;
      border-left: 1px solid var(--border);
      padding-left: 8px;
    }

    .waterfall-markers {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
      padding-left: 10px;
    }

    .waterfall-marker {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }

    .waterfall-marker:hover { border-color: var(--accent); color: var(--text); }
    .waterfall-marker.gate { border-color: var(--yellow); color: var(--yellow); }
    .waterfall-marker.start { border-color: var(--green); color: var(--green); }
    .waterfall-marker.complete { border-color: var(--cyan); color: var(--cyan); }

    .waterfall-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    /* ─── Animations ─── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <!-- ─── Header ─── -->
  <header>
    <div class="header-left">
      <h1>Agent <span>Cortex</span> Trace</h1>
      <div class="nav-tabs" id="nav-tabs">
        <button class="nav-tab active" data-tab="narrative">Narrative</button>
        <button class="nav-tab" data-tab="timeline">Timeline</button>
        <button class="nav-tab" data-tab="flow">Flow</button>
        <button class="nav-tab" data-tab="brain">Brain Map</button>
        <button class="nav-tab" data-tab="waterfall">Waterfall</button>
      </div>
    </div>
  </header>

  <!-- ─── Stats bar ─── -->
  <div class="stats-bar" id="stats-bar">
    <div class="stat"><span class="stat-value" id="stat-events">0</span><span class="stat-label">Events</span></div>
    <div class="stat"><span class="stat-value" id="stat-components">0</span><span class="stat-label">Components</span></div>
    <div class="stat"><span class="stat-value" id="stat-tasks">0</span><span class="stat-label">Tasks</span></div>
    <div class="stat"><span class="stat-value" id="stat-duration">0s</span><span class="stat-label">Duration</span></div>
  </div>

  <!-- ─── Tab content ─── -->
  <div class="tab-content">

    <!-- Narrative -->
    <div class="tab-pane active" id="tab-narrative">
      <div class="narrative-left">
        <div class="narrative-left-header">Steps</div>
        <div class="narrative-list" id="narrative-list"></div>
      </div>
      <div class="narrative-center" id="narrative-center">
        <div class="narrative-empty">Select a step from the list</div>
      </div>
      <div class="narrative-right" id="narrative-right">
        <div class="narrative-empty">No step selected</div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="tab-pane" id="tab-timeline">
      <div class="timeline-left">
        <div class="timeline-filters">
          <input class="timeline-search" id="timeline-search" type="text" placeholder="Search events...">
          <select class="timeline-filter-select" id="timeline-region-filter">
            <option value="">All regions</option>
          </select>
          <select class="timeline-filter-select" id="timeline-severity-filter">
            <option value="">All severity</option>
            <option value="trace">Trace</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        <div class="timeline-list" id="timeline-list"></div>
      </div>
      <div class="timeline-inspector" id="timeline-inspector">
        <div class="inspector-empty">Click an event to inspect</div>
      </div>
    </div>

    <!-- Flow -->
    <div class="tab-pane" id="tab-flow">
      <div class="flow-container" id="flow-container">
        <div class="flow-empty">Loading flow graph...</div>
      </div>
    </div>

    <!-- Brain Map -->
    <div class="tab-pane" id="tab-brain">
      <div class="brain-map-area" id="brain-map-area"></div>
      <div class="brain-sidebar" id="brain-sidebar">
        <div class="brain-sidebar-header">Select a region</div>
        <div class="brain-sidebar-events" id="brain-sidebar-events"></div>
      </div>
    </div>

    <!-- Waterfall -->
    <div class="tab-pane" id="tab-waterfall">
      <div class="waterfall-container" id="waterfall-container">
        <div class="waterfall-empty">Loading waterfall...</div>
      </div>
    </div>

  </div>

  <!-- ─── Stepper bar ─── -->
  <div class="stepper-bar" id="stepper-bar">
    <div class="stepper-group">
      <button class="stepper-btn" id="btn-replay" title="Replay mode">Replay</button>
      <button class="stepper-btn active-mode" id="btn-live" title="Live mode">Live</button>
    </div>
    <div class="stepper-sep"></div>
    <div class="stepper-group">
      <button class="stepper-btn" id="btn-first" title="First (Home)">|&lt;&lt;</button>
      <button class="stepper-btn" id="btn-prev" title="Previous (Left / P)">&lt;</button>
      <button class="stepper-btn" id="btn-next" title="Next (Right / N)">&gt;</button>
      <button class="stepper-btn" id="btn-last" title="Last (End)">&gt;&gt;|</button>
    </div>
    <div class="stepper-sep"></div>
    <div class="stepper-group">
      <select class="stepper-select" id="granularity-select" title="Granularity">
        <option value="event">Event</option>
        <option value="phase">Phase</option>
        <option value="cycle">Cycle</option>
        <option value="task">Task</option>
        <option value="llm-call">LLM Call</option>
        <option value="rhythm">Rhythm</option>
      </select>
    </div>
    <div class="stepper-sep"></div>
    <div class="stepper-group">
      <span class="speed-label" id="speed-display">Manual</span>
      <input class="speed-slider" id="speed-slider" type="range" min="0" max="2000" step="50" value="0" title="Speed (ms)">
    </div>
    <div class="stepper-sep"></div>
    <div class="position-display" id="position-display">0 / 0</div>
    <div class="stepper-sep"></div>
    <button class="stepper-btn" id="btn-stop" title="Stop (Escape)">Stop</button>
    <div class="stepper-sep"></div>
    <div class="stepper-group" id="exec-controls">
      <button class="stepper-btn" id="btn-pause" title="Pause execution">Pause</button>
      <button class="stepper-btn" id="btn-step-exec" title="Step one operation">Step</button>
      <button class="stepper-btn" id="btn-resume" title="Resume live execution">Resume</button>
      <button class="stepper-btn" id="btn-replay-from" title="Resume from selected step" disabled>Replay From Here</button>
    </div>
    <div class="stepper-sep"></div>
    <span class="exec-status" id="exec-status">Live</span>
    <span class="kbd-hint">Arrows/N/P step | Space replay+advance | 1-5 tabs | Esc stop</span>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // Region + severity colors
    // ═══════════════════════════════════════════════════════════
    const REGION_COLORS = {
      'brainstem':      '#ff6b6b',
      'pfc':            '#6c8cff',
      'thalamus':       '#ffd93d',
      'sensory-cortex': '#6bcb77',
      'motor-cortex':   '#ff8c42',
      'pns':            '#c77dff',
      'basal-ganglia':  '#4ecdc4',
      'cerebellum':     '#ff6b9d',
      'hippocampus':    '#45b7d1',
      'amygdala':       '#ff4757',
      'dopamine':       '#ffa502',
      'plasticity':     '#a29bfe',
      'ne':             '#fd79a8',
      'llm':            '#00cec9',
      'probes':         '#55efc4',
      'cost':           '#fdcb6e',
      'research':       '#e17055',
      'exteroception':  '#74b9ff',
      'deliberation':   '#dfe6e9',
      'sandbox':        '#636e72',
      'visual':         '#b2bec3',
      'vitals':         '#ff7675',
      'unknown':        '#666',
    };

    const SEVERITY_COLORS = {
      'trace':    '#555',
      'info':     '#6c8cff',
      'warn':     '#ffd93d',
      'error':    '#ff6b6b',
      'critical': '#ff4757',
    };

    function regionColor(r) { return REGION_COLORS[r] || REGION_COLORS.unknown; }
    function severityColor(s) { return SEVERITY_COLORS[s] || '#666'; }

    function fmtDuration(ms) {
      if (ms == null) return '?';
      if (ms < 1000) return ms + 'ms';
      if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
      return (ms / 60000).toFixed(1) + 'm';
    }

    function fmtBytes(b) {
      if (b == null) return '';
      if (b < 1024) return b + 'B';
      if (b < 1048576) return (b / 1024).toFixed(1) + 'KB';
      return (b / 1048576).toFixed(1) + 'MB';
    }

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ═══════════════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════════════
    let currentTab = 'narrative';
    let narrativeSteps = [];
    let selectedStepIdx = -1;
    let timelineEvents = [];
    let selectedEventIdx = -1;
    let flowData = null;
    let waterfallData = null;
    let brainRegionEvents = new Map();
    let selectedBrainRegion = null;
    let stepperState = { mode: 'live', position: 0, total: 0 };
    let autoplayTimer = null;

    // ═══════════════════════════════════════════════════════════
    // Tabs
    // ═══════════════════════════════════════════════════════════
    const tabBtns = document.querySelectorAll('.nav-tab');
    const tabPanes = document.querySelectorAll('.tab-pane');

    function switchTab(name) {
      currentTab = name;
      tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      tabPanes.forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    }

    tabBtns.forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

    // ═══════════════════════════════════════════════════════════
    // Stats
    // ═══════════════════════════════════════════════════════════
    async function loadStats() {
      try {
        const r = await fetch('/trace/api/summary');
        if (!r.ok) return;
        const d = await r.json();
        document.getElementById('stat-events').textContent = d.eventCount ?? 0;
        document.getElementById('stat-components').textContent = d.componentCount ?? 0;
        document.getElementById('stat-tasks').textContent = d.taskCount ?? 0;
        document.getElementById('stat-duration').textContent = fmtDuration(d.durationMs ?? 0);
      } catch (_) {}
    }

    // ═══════════════════════════════════════════════════════════
    // Narrative tab
    // ═══════════════════════════════════════════════════════════
    async function loadNarrative() {
      try {
        const r = await fetch('/trace/api/narrative/all');
        if (!r.ok) return;
        const data = await r.json();
        narrativeSteps = (data.steps || data || []).filter(s => s.kind !== 'structured-parse');
        renderNarrativeList();
      } catch (_) {}
    }

    function renderNarrativeList() {
      const el = document.getElementById('narrative-list');
      el.innerHTML = narrativeSteps.map((step, i) => {
        const c = regionColor(step.region);
        return `<div class="narrative-item${i === selectedStepIdx ? ' selected' : ''}" data-idx="${i}">
          <span class="region-dot" style="background:${c};margin-top:4px"></span>
          <div class="narrative-item-content">
            <div class="narrative-item-headline" style="color:${c}">${esc(step.headline || step.kind || 'Step ' + (i + 1))}</div>
            <div class="narrative-item-meta">
              <span>${esc(step.actor || '')}</span>
              <span>${step.timestamp ? new Date(step.timestamp).toLocaleTimeString() : ''}</span>
            </div>
          </div>
        </div>`;
      }).join('');

      el.querySelectorAll('.narrative-item').forEach(item => {
        item.addEventListener('click', () => selectStep(parseInt(item.dataset.idx)));
      });
    }

    function selectStep(idx) {
      if (idx < 0 || idx >= narrativeSteps.length) return;
      selectedStepIdx = idx;
      // Track selected narrative for "Replay From Here"
      if (typeof selectedNarrative !== 'undefined') {
        selectedNarrative = narrativeSteps[idx];
        const rfBtn = document.getElementById('btn-replay-from');
        if (rfBtn) rfBtn.disabled = !selectedNarrative?.contentId;
      }
      renderNarrativeList();
      renderNarrativeCenter();
      renderNarrativeRight();
      const sel = document.querySelector('.narrative-item.selected');
      if (sel) sel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    async function renderNarrativeCenter() {
      const el = document.getElementById('narrative-center');
      if (selectedStepIdx < 0) {
        el.innerHTML = '<div class="narrative-empty">Select a step from the list</div>';
        return;
      }

      const step = narrativeSteps[selectedStepIdx];
      const color = regionColor(step.region);
      const sections = step.sections || [];

      let sectionsHtml = '';
      for (const sec of sections) {
        const sizeStr = sec.byteSize != null ? fmtBytes(sec.byteSize) : '';
        const ct = sec.contentType || 'prose';
        const colorCls = 'content-' + ct;
        let bodyHtml = '';

        const raw = sec.content || '';
        const isHtml = raw.includes('<!DOCTYPE') || raw.includes('<html');

        if (isHtml) {
          bodyHtml = `<div class="iframe-container">
            <button class="iframe-toggle" onclick="toggleIframe(this)">Source</button>
            <iframe class="narrative-iframe" sandbox="allow-scripts" srcdoc="${esc(raw)}"></iframe>
            <pre class="narrative-section-content ${colorCls}" style="display:none">${esc(raw)}</pre>
          </div>`;
        } else {
          let content = raw;
          if (!content && sec.contentId) {
            try {
              const cr = await fetch('/trace/api/content/id/' + encodeURIComponent(sec.contentId));
              if (cr.ok) {
                const cd = await cr.json();
                content = cd.content || cd.text || JSON.stringify(cd, null, 2);
              }
            } catch (_) { content = '[Failed to load content]'; }
          }
          bodyHtml = `<pre class="narrative-section-content ${colorCls}">${esc(content)}</pre>`;
        }

        sectionsHtml += `<div class="narrative-section">
          <div class="narrative-section-header" onclick="this.parentElement.classList.toggle('open')">
            <div class="narrative-section-left">
              <span class="narrative-section-chevron">&#9654;</span>
              <span class="narrative-section-label">${esc(sec.label || sec.contentType || 'Content')}</span>
            </div>
            <span class="narrative-section-size">${sizeStr}</span>
          </div>
          <div class="narrative-section-body">${bodyHtml}</div>
        </div>`;
      }

      el.innerHTML = `
        <div class="narrative-headline" style="color:${color}">${esc(step.headline || step.kind || '')}</div>
        <div class="narrative-summary">${esc(step.summary || '')}</div>
        ${sectionsHtml}
      `;
    }

    function renderNarrativeRight() {
      const el = document.getElementById('narrative-right');
      if (selectedStepIdx < 0) {
        el.innerHTML = '<div class="narrative-empty">No step selected</div>';
        return;
      }

      const step = narrativeSteps[selectedStepIdx];
      const color = regionColor(step.region);
      const dests = (step.routingDestinations || []).join(', ') || 'none';

      el.innerHTML = `
        <div class="context-section">
          <div class="context-label">Kind</div>
          <div class="context-value">${esc(step.kind || '')}</div>
        </div>
        <div class="context-section">
          <div class="context-label">Actor</div>
          <div class="context-value">${esc(step.actor || '')}</div>
        </div>
        <div class="context-section">
          <div class="context-label">Region</div>
          <div class="context-value" style="color:${color}">${esc(step.region || '')}</div>
        </div>
        <div class="context-section">
          <div class="context-label">Time</div>
          <div class="context-value">${step.timestamp ? new Date(step.timestamp).toLocaleString() : 'unknown'}</div>
        </div>
        <div class="context-section">
          <div class="context-label">Content ID</div>
          <div class="context-value dim">${esc(step.contentId || step.id || 'none')}</div>
        </div>
        ${step.tokens != null ? `<div class="context-section">
          <div class="context-label">Tokens</div>
          <div class="context-value">${step.tokens.toLocaleString()}</div>
        </div>` : ''}
        ${step.cost != null ? `<div class="context-section">
          <div class="context-label">Cost</div>
          <div class="context-value">$${step.cost.toFixed(4)}</div>
        </div>` : ''}
        <div class="context-section">
          <div class="context-label">Routing</div>
          <div class="context-value dim">${esc(dests)}</div>
        </div>
        <div class="context-section">
          <div class="context-label">Position</div>
          <div class="context-value">${selectedStepIdx + 1} / ${narrativeSteps.length}</div>
        </div>
        <div class="context-nav">
          <button class="context-nav-btn" onclick="selectStep(${selectedStepIdx - 1})" ${selectedStepIdx <= 0 ? 'disabled' : ''}>Prev</button>
          <button class="context-nav-btn" onclick="selectStep(${selectedStepIdx + 1})" ${selectedStepIdx >= narrativeSteps.length - 1 ? 'disabled' : ''}>Next</button>
        </div>
      `;
    }

    window.toggleIframe = function(btn) {
      const container = btn.parentElement;
      const iframe = container.querySelector('iframe');
      const pre = container.querySelector('pre');
      if (iframe.style.display === 'none') {
        iframe.style.display = '';
        pre.style.display = 'none';
        btn.textContent = 'Source';
      } else {
        iframe.style.display = 'none';
        pre.style.display = '';
        btn.textContent = 'Visual';
      }
    };

    // ═══════════════════════════════════════════════════════════
    // Timeline tab
    // ═══════════════════════════════════════════════════════════
    async function loadTimeline() {
      try {
        const r = await fetch('/trace/api/events?limit=500');
        if (!r.ok) return;
        const data = await r.json();
        timelineEvents = data.events || data || [];
        populateRegionFilter();
        renderTimelineList();
      } catch (_) {}
    }

    function populateRegionFilter() {
      const regions = new Set();
      timelineEvents.forEach(ev => { if (ev.region) regions.add(ev.region); });
      const sel = document.getElementById('timeline-region-filter');
      const cur = sel.value;
      sel.innerHTML = '<option value="">All regions</option>';
      Array.from(regions).sort().forEach(r => {
        const o = document.createElement('option');
        o.value = r; o.textContent = r;
        sel.appendChild(o);
      });
      sel.value = cur;
    }

    function filteredEvents() {
      const q = document.getElementById('timeline-search').value.toLowerCase();
      const rf = document.getElementById('timeline-region-filter').value;
      const sf = document.getElementById('timeline-severity-filter').value;
      return timelineEvents.filter(ev => {
        if (q && !(ev.type || '').toLowerCase().includes(q) && !(ev.region || '').toLowerCase().includes(q)) return false;
        if (rf && ev.region !== rf) return false;
        if (sf && ev.severity !== sf) return false;
        return true;
      });
    }

    function renderTimelineList() {
      const el = document.getElementById('timeline-list');
      const evts = filteredEvents();

      el.innerHTML = evts.map((ev, i) => {
        const c = regionColor(ev.region);
        const sevCls = ev.severity ? 'severity-' + ev.severity : '';
        const rhythmCtx = ev.rhythmContext ? `${ev.rhythmContext.rhythm || ''} ${ev.rhythmContext.phase || ''}`.trim() : '';
        const origIdx = timelineEvents.indexOf(ev);
        const delta = ev.deltaMs != null ? fmtDuration(ev.deltaMs) : '';

        return `<div class="timeline-event${origIdx === selectedEventIdx ? ' selected' : ''}" data-oidx="${origIdx}">
          <span class="timeline-seq">${ev.seq ?? i}</span>
          <span class="region-dot" style="background:${c};margin-top:4px"></span>
          <div class="timeline-event-content">
            <div class="timeline-event-type">${esc(ev.type || ev.kind || '')}</div>
            ${rhythmCtx ? `<div class="timeline-event-rhythm">${esc(rhythmCtx)}</div>` : ''}
          </div>
          <div class="timeline-event-right">
            ${ev.severity ? `<span class="severity-badge ${sevCls}">${ev.severity}</span>` : ''}
            ${delta ? `<span class="timeline-delta">${delta}</span>` : ''}
          </div>
        </div>`;
      }).join('');

      el.querySelectorAll('.timeline-event').forEach(item => {
        item.addEventListener('click', () => {
          selectedEventIdx = parseInt(item.dataset.oidx);
          renderTimelineList();
          renderInspector();
        });
      });
    }

    function renderInspector() {
      const el = document.getElementById('timeline-inspector');
      if (selectedEventIdx < 0 || selectedEventIdx >= timelineEvents.length) {
        el.innerHTML = '<div class="inspector-empty">Click an event to inspect</div>';
        return;
      }

      const ev = timelineEvents[selectedEventIdx];
      const c = regionColor(ev.region);

      let rhythmHtml = '';
      if (ev.rhythmContext) {
        rhythmHtml = `<div class="inspector-section">
          <div class="inspector-section-label">Rhythm Context</div>
          <div class="inspector-json">${esc(JSON.stringify(ev.rhythmContext, null, 2))}</div>
        </div>`;
      }

      let diagHtml = '';
      if (ev.diagnosticContext) {
        diagHtml = `<div class="inspector-section">
          <div class="inspector-section-label">Diagnostic Context</div>
          <div class="inspector-json">${esc(JSON.stringify(ev.diagnosticContext, null, 2))}</div>
        </div>`;
      }

      el.innerHTML = `
        <div class="inspector-header" style="color:${c}">${esc(ev.type || ev.kind || 'Event')}</div>
        ${rhythmHtml}
        ${diagHtml}
        <div class="inspector-section">
          <div class="inspector-section-label">Full Payload</div>
          <div class="inspector-json">${esc(JSON.stringify(ev, null, 2))}</div>
        </div>
      `;
    }

    document.getElementById('timeline-search').addEventListener('input', renderTimelineList);
    document.getElementById('timeline-region-filter').addEventListener('change', renderTimelineList);
    document.getElementById('timeline-severity-filter').addEventListener('change', renderTimelineList);

    // ═══════════════════════════════════════════════════════════
    // Flow tab
    // ═══════════════════════════════════════════════════════════
    async function loadFlow() {
      try {
        const r = await fetch('/trace/api/flow');
        if (!r.ok) return;
        flowData = await r.json();
        renderFlow();
      } catch (_) {}
    }

    function renderFlow() {
      const el = document.getElementById('flow-container');
      if (!flowData || (!flowData.nodes && !flowData.edges)) {
        el.innerHTML = '<div class="flow-empty">No flow data available</div>';
        return;
      }

      const nodes = flowData.nodes || [];
      const edges = flowData.edges || [];
      if (nodes.length === 0) {
        el.innerHTML = '<div class="flow-empty">No components active</div>';
        return;
      }

      const W = 900, H = 600, R = 28;
      const angleStep = (2 * Math.PI) / Math.max(nodes.length, 1);
      const posMap = new Map();

      nodes.forEach((n, i) => {
        const a = angleStep * i - Math.PI / 2;
        const x = W / 2 + W * 0.38 * Math.cos(a);
        const y = H / 2 + H * 0.38 * Math.sin(a);
        posMap.set(n.id, { x, y, node: n });
      });

      let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
      svg += `<defs><marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker></defs>`;

      edges.forEach(e => {
        const f = posMap.get(e.from || e.source);
        const t = posMap.get(e.to || e.target);
        if (f && t) {
          const dx = t.x - f.x, dy = t.y - f.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d > 0) {
            svg += `<line x1="${f.x + dx / d * R}" y1="${f.y + dy / d * R}" x2="${t.x - dx / d * (R + 8)}" y2="${t.y - dy / d * (R + 8)}" stroke="#444" stroke-width="1.5" marker-end="url(#ah)" opacity="0.6"/>`;
          }
        }
      });

      posMap.forEach(({ x, y, node }) => {
        const c = regionColor(node.region);
        const lbl = (node.label || node.id || '').substring(0, 12);
        const glow = node.active ? `<circle cx="${x}" cy="${y}" r="${R + 6}" fill="none" stroke="${c}" stroke-width="2" opacity="0.3"><animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/></circle>` : '';
        svg += `${glow}<circle cx="${x}" cy="${y}" r="${R}" fill="${c}22" stroke="${c}" stroke-width="2"/>`;
        svg += `<text x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="middle" fill="${c}" font-size="9" font-family="monospace" font-weight="600">${esc(lbl)}</text>`;
      });

      svg += '</svg>';
      el.innerHTML = svg;
    }

    // ═══════════════════════════════════════════════════════════
    // Brain Map tab
    // ═══════════════════════════════════════════════════════════
    const BRAIN_POS = {
      'pfc':            { top: '8%',  left: '35%' },
      'thalamus':       { top: '30%', left: '42%' },
      'sensory-cortex': { top: '15%', left: '65%' },
      'motor-cortex':   { top: '15%', left: '12%' },
      'basal-ganglia':  { top: '42%', left: '25%' },
      'hippocampus':    { top: '50%', left: '58%' },
      'amygdala':       { top: '55%', left: '38%' },
      'cerebellum':     { top: '72%', left: '45%' },
      'brainstem':      { top: '82%', left: '42%' },
      'dopamine':       { top: '60%', left: '15%' },
      'ne':             { top: '60%', left: '72%' },
      'plasticity':     { top: '38%', left: '72%' },
      'pns':            { top: '30%', left: '8%' },
      'llm':            { top: '5%',  left: '80%' },
      'probes':         { top: '85%', left: '70%' },
      'cost':           { top: '85%', left: '18%' },
      'research':       { top: '72%', left: '70%' },
      'exteroception':  { top: '25%', left: '82%' },
      'deliberation':   { top: '20%', left: '48%' },
      'sandbox':        { top: '72%', left: '18%' },
      'visual':         { top: '8%',  left: '52%' },
      'vitals':         { top: '90%', left: '45%' },
    };

    function renderBrainMap() {
      const area = document.getElementById('brain-map-area');
      area.innerHTML = '';

      brainRegionEvents = new Map();
      timelineEvents.forEach(ev => {
        const r = ev.region || 'unknown';
        if (!brainRegionEvents.has(r)) brainRegionEvents.set(r, []);
        brainRegionEvents.get(r).push(ev);
      });

      Object.entries(BRAIN_POS).forEach(([region, pos]) => {
        const evts = brainRegionEvents.get(region) || [];
        const last = evts[evts.length - 1];
        const c = regionColor(region);
        const active = last && (Date.now() - new Date(last.time || 0).getTime()) < 10000;

        const div = document.createElement('div');
        div.className = 'brain-region' + (active ? ' active' : '');
        div.style.top = pos.top;
        div.style.left = pos.left;
        if (evts.length > 0) div.style.borderColor = c;
        div.innerHTML = `
          <div class="brain-region-name" style="color:${c}">${region}</div>
          <div class="brain-region-count">${evts.length} events</div>
          ${last ? `<div class="brain-region-last">${esc(last.type || '')}</div>` : ''}
        `;
        div.addEventListener('click', () => selectBrainRegion(region));
        area.appendChild(div);
      });
    }

    function selectBrainRegion(region) {
      selectedBrainRegion = region;
      const c = regionColor(region);
      const evts = brainRegionEvents.get(region) || [];

      document.querySelector('.brain-sidebar-header').innerHTML =
        `<span style="color:${c}">${region}</span> <span style="color:var(--text-dim)">(${evts.length})</span>`;

      document.getElementById('brain-sidebar-events').innerHTML = evts.slice(-50).reverse().map(ev => `
        <div class="brain-sidebar-event">
          <div class="brain-sidebar-event-type">${esc(ev.type || ev.kind || '')}</div>
          <div class="brain-sidebar-event-time">${ev.time ? new Date(ev.time).toLocaleTimeString() : ''}</div>
        </div>
      `).join('');
    }

    // ═══════════════════════════════════════════════════════════
    // Waterfall tab
    // ═══════════════════════════════════════════════════════════
    async function loadWaterfall() {
      try {
        const r = await fetch('/trace/api/waterfall');
        if (!r.ok) return;
        waterfallData = await r.json();
        renderWaterfall();
      } catch (_) {}
    }

    function renderWaterfall() {
      const el = document.getElementById('waterfall-container');
      const spans = waterfallData?.spans || waterfallData || [];

      if (!spans || spans.length === 0) {
        el.innerHTML = '<div class="waterfall-empty">No rhythm spans recorded</div>';
        return;
      }

      let maxEnd = 0;
      function walk(list) {
        (list || []).forEach(s => {
          const end = (s.startMs || 0) + (s.durationMs || 0);
          if (end > maxEnd) maxEnd = end;
          if (s.children) walk(s.children);
        });
      }
      walk(spans);
      if (maxEnd === 0) maxEnd = 1;

      function renderTree(list) {
        return (list || []).map(span => {
          const c = regionColor(span.region || 'brainstem');
          const barW = Math.max(((span.durationMs || 0) / maxEnd) * 100, 0.5);
          const barOff = ((span.startMs || 0) / maxEnd) * 100;

          const markers = (span.markers || []).map(m => {
            let cls = 'waterfall-marker';
            const lbl = (m.label || m.type || '').toLowerCase();
            if (lbl.includes('gate')) cls += ' gate';
            else if (lbl.includes('start')) cls += ' start';
            else if (lbl.includes('complete')) cls += ' complete';
            return `<span class="${cls}" title="${esc(m.detail || '')}">${esc(m.label || m.type || '')}</span>`;
          }).join('');

          const children = span.children && span.children.length > 0
            ? `<div class="waterfall-children">${renderTree(span.children)}</div>` : '';

          return `<div class="waterfall-span">
            <div class="waterfall-span-header">
              <div class="waterfall-span-bar" style="background:${c};width:${barW}%;margin-left:${barOff}%"></div>
              <span class="waterfall-span-name" style="color:${c}">${esc(span.name || span.rhythm || '')}</span>
              ${span.cycles != null ? `<span class="waterfall-span-cycles">${span.cycles} cycles</span>` : ''}
              <span class="waterfall-span-duration">${fmtDuration(span.durationMs)}</span>
            </div>
            ${markers ? `<div class="waterfall-markers">${markers}</div>` : ''}
            ${children}
          </div>`;
        }).join('');
      }

      el.innerHTML = renderTree(spans);
    }

    // ═══════════════════════════════════════════════════════════
    // Stepper controls
    // ═══════════════════════════════════════════════════════════
    async function stepperPost(action, body) {
      try {
        await fetch('/trace/api/stepper/' + action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined,
        });
      } catch (_) {}
    }

    document.getElementById('btn-replay').addEventListener('click', () => {
      stepperPost('mode', { mode: 'replay' });
      document.getElementById('btn-replay').classList.add('active-mode');
      document.getElementById('btn-live').classList.remove('active-mode');
      stepperState.mode = 'replay';
    });

    document.getElementById('btn-live').addEventListener('click', () => {
      stepperPost('mode', { mode: 'live' });
      document.getElementById('btn-live').classList.add('active-mode');
      document.getElementById('btn-replay').classList.remove('active-mode');
      stepperState.mode = 'live';
    });

    document.getElementById('btn-first').addEventListener('click', () => stepperPost('first'));
    document.getElementById('btn-prev').addEventListener('click', () => stepperPost('prev'));
    document.getElementById('btn-next').addEventListener('click', () => stepperPost('next'));
    document.getElementById('btn-last').addEventListener('click', () => stepperPost('last'));
    document.getElementById('btn-stop').addEventListener('click', stopAutoplay);

    document.getElementById('granularity-select').addEventListener('change', (e) => {
      stepperPost('granularity', { granularity: e.target.value });
    });

    const speedSlider = document.getElementById('speed-slider');
    const speedDisplay = document.getElementById('speed-display');

    speedSlider.addEventListener('input', () => {
      const v = parseInt(speedSlider.value);
      speedDisplay.textContent = v === 0 ? 'Manual' : v + 'ms';
      stepperPost('speed', { speed: v });
      updateAutoplay(v);
    });

    function updateAutoplay(speed) {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
      if (speed > 0 && stepperState.mode === 'replay') {
        autoplayTimer = setInterval(() => stepperPost('next'), speed);
      }
    }

    function stopAutoplay() {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
      speedSlider.value = 0;
      speedDisplay.textContent = 'Manual';
      stepperPost('stop');
    }

    function updatePosition() {
      document.getElementById('position-display').textContent =
        `${stepperState.position} / ${stepperState.total}`;
    }

    // ═══════════════════════════════════════════════════════════
    // SSE connections
    // ═══════════════════════════════════════════════════════════
    function connectTraceStream() {
      const es = new EventSource('/trace/stream');
      es.onmessage = (e) => {
        try {
          const ev = JSON.parse(e.data);
          timelineEvents.push(ev);
          if (currentTab === 'timeline') renderTimelineList();
        } catch (_) {}
      };
      es.onerror = () => { es.close(); setTimeout(connectTraceStream, 3000); };
    }

    function connectStepperStream() {
      const es = new EventSource('/trace/stepper-stream');
      es.onmessage = (e) => {
        try {
          const s = JSON.parse(e.data);
          if (s.position != null) stepperState.position = s.position;
          if (s.total != null) stepperState.total = s.total;
          if (s.mode) {
            stepperState.mode = s.mode;
            document.getElementById('btn-replay').classList.toggle('active-mode', s.mode === 'replay');
            document.getElementById('btn-live').classList.toggle('active-mode', s.mode === 'live');
          }
          if (s.granularity) document.getElementById('granularity-select').value = s.granularity;
          updatePosition();

          // Sync narrative selection with stepper position
          if (s.position != null && narrativeSteps.length > 0) {
            const idx = Math.min(s.position, narrativeSteps.length) - 1;
            if (idx >= 0 && idx !== selectedStepIdx) selectStep(idx);
          }
        } catch (_) {}
      };
      es.onerror = () => { es.close(); setTimeout(connectStepperStream, 3000); };
    }

    // ═══════════════════════════════════════════════════════════
    // Auto-refresh per tab
    // ═══════════════════════════════════════════════════════════
    // Narrative: 5s
    setInterval(() => {
      if (currentTab === 'narrative') { loadNarrative(); loadStats(); }
    }, 5000);

    // Flow + Brain Map: 2s
    setInterval(() => {
      if (currentTab === 'flow') loadFlow();
      if (currentTab === 'brain') { loadTimeline().then(() => renderBrainMap()); }
    }, 2000);

    // Waterfall: 3s
    setInterval(() => {
      if (currentTab === 'waterfall') loadWaterfall();
    }, 3000);

    // Stats: 5s always
    setInterval(loadStats, 5000);

    // ═══════════════════════════════════════════════════════════
    // ── Execution controls ─────────────────────────────────────
    const execStatus = document.getElementById('exec-status');
    const btnPause = document.getElementById('btn-pause');
    const btnStepExec = document.getElementById('btn-step-exec');
    const btnResume = document.getElementById('btn-resume');
    const btnReplayFrom = document.getElementById('btn-replay-from');

    async function execPost(action, body) {
      try {
        const resp = await fetch('/trace/api/exec/' + action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined,
        });
        return await resp.json();
      } catch (e) {
        console.error('Exec request failed:', e);
      }
    }

    btnPause.addEventListener('click', () => execPost('pause'));
    btnStepExec.addEventListener('click', () => execPost('step'));
    btnResume.addEventListener('click', () => execPost('resume'));
    btnReplayFrom.addEventListener('click', () => {
      if (selectedNarrative && selectedNarrative.contentId != null) {
        execPost('replay-from', { contentId: selectedNarrative.contentId });
      }
    });

    // Enable "Replay From Here" when a narrative step is selected
    let selectedNarrative = null;
    const origSelectNarrative = typeof selectNarrative === 'function' ? selectNarrative : null;

    // Hook into narrative selection to track selected entry
    function hookNarrativeSelection() {
      const narrativeSteps = document.querySelectorAll('.narrative-item, [data-content-id]');
      // The narrative click handler sets selectedNarrative via the existing pick() or selectNarrative() function
    }

    // SSE for execution state
    function connectExecStream() {
      const es = new EventSource('/trace/exec-stream');
      es.onmessage = (e) => {
        try {
          const state = JSON.parse(e.data);
          updateExecStatus(state);
        } catch {}
      };
      es.onerror = () => {
        es.close();
        setTimeout(connectExecStream, 3000);
      };
    }

    function updateExecStatus(state) {
      const mode = state.mode || 'live';
      execStatus.textContent = mode === 'paused' && state.label
        ? `Paused: ${state.label}`
        : mode.charAt(0).toUpperCase() + mode.slice(1);
      execStatus.className = 'exec-status mode-' + mode;

      // Update button states
      btnPause.disabled = mode === 'paused';
      btnStepExec.disabled = mode !== 'paused' && mode !== 'stepping';
      btnResume.disabled = mode === 'live';
    }

    connectExecStream();

    // Poll exec status as fallback (in case SSE hasn't connected yet)
    setInterval(async () => {
      try {
        const resp = await fetch('/trace/api/exec/status');
        const state = await resp.json();
        updateExecStatus(state);
      } catch {}
    }, 3000);

    // Keyboard shortcuts
    // ═══════════════════════════════════════════════════════════
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

      switch (e.key) {
        case 'ArrowRight': case 'n':
          e.preventDefault(); stepperPost('next'); break;
        case 'ArrowLeft': case 'p':
          e.preventDefault(); stepperPost('prev'); break;
        case ' ':
          e.preventDefault();
          if (stepperState.mode !== 'replay') {
            stepperPost('mode', { mode: 'replay' });
            document.getElementById('btn-replay').classList.add('active-mode');
            document.getElementById('btn-live').classList.remove('active-mode');
            stepperState.mode = 'replay';
          }
          stepperPost('next');
          break;
        case '1': switchTab('narrative'); break;
        case '2': switchTab('timeline'); break;
        case '3': switchTab('flow'); break;
        case '4': switchTab('brain'); break;
        case '5': switchTab('waterfall'); break;
        case 'Escape': stopAutoplay(); break;
        case 'Home': e.preventDefault(); stepperPost('first'); break;
        case 'End':  e.preventDefault(); stepperPost('last');  break;
      }
    });

    // ═══════════════════════════════════════════════════════════
    // Init
    // ═══════════════════════════════════════════════════════════
    async function init() {
      await Promise.all([loadStats(), loadNarrative(), loadTimeline()]);
      renderBrainMap();
      loadFlow();
      loadWaterfall();
      connectTraceStream();
      connectStepperStream();
    }

    init();
  </script>
